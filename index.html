<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investasi Harian 0.9% - Premium</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }

  body {
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    overflow-x:hidden;
  }
  /* partikel premium */
  body::before {
    content:"";
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.4), transparent),
      radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,.3), transparent),
      radial-gradient(2px 2px at 60% 20%, rgba(255,215,0,.4), transparent),
      radial-gradient(2px 2px at 80% 60%, rgba(255,255,255,.35), transparent),
      radial-gradient(2px 2px at 10% 80%, rgba(255,215,0,.3), transparent),
      radial-gradient(2px 2px at 70% 90%, rgba(255,255,255,.3), transparent);
    background-size:300px 300px;
    animation: float 40s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  @keyframes float { to { background-position: 300px 300px; } }

  .container {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:30px;
    width:100%;
    max-width:520px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    position:relative;
    z-index:1;
    color:#fff;
  }
  h1 {
    text-align:center;
    font-size:22px;
    margin-bottom:4px;
    background:linear-gradient(90deg,#ffd700,#fff,#ffd700);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle { text-align:center; font-size:12px; color:#c9c9e0; margin-bottom:22px; }

  .form-group { margin-bottom:14px; }
  label { display:block; font-size:13px; color:#dcdef5; margin-bottom:6px; }
  input, select {
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-size:14px;
    outline:none;
    transition:.3s;
  }
  input:focus, select:focus { border-color:#ffd700; background:rgba(255,255,255,0.14); }
  input::placeholder { color:#8a8ab0; }
  select option { color:#000; }

  .btn {
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    color:#1a1a2e;
    background:linear-gradient(90deg,#ffd700,#ffb800);
    letter-spacing:.5px;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(255,215,0,.35); }
  .btn-secondary {
    background:rgba(255,255,255,0.1);
    color:#fff;
    border:1px solid rgba(255,255,255,0.25);
  }
  .btn-secondary:hover { box-shadow:0 8px 20px rgba(255,255,255,.15); }
  .btn-danger { background:linear-gradient(90deg,#ff6b6b,#e74c3c); color:#fff; }
  .btn-sm { width:auto; padding:8px 14px; font-size:13px; }

  .link { text-align:center; margin-top:14px; font-size:13px; color:#c9c9e0; }
  .link a { color:#ffd700; text-decoration:none; cursor:pointer; font-weight:bold; }

  .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px; }
  .menu-card {
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    min-height:84px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
  }
  .menu-card:hover { background:rgba(255,215,0,0.15); border-color:#ffd700; transform:translateY(-3px); }
  .menu-card .icon { font-size:26px; margin-bottom:6px; }
  .menu-card .txt { font-size:12px; font-weight:bold; line-height:1.3; }
  .menu-card .small { font-size:10px; color:#c9c9e0; }

  .balance-box {
    background:linear-gradient(135deg, rgba(255,215,0,.18), rgba(255,215,0,.05));
    border:1px solid rgba(255,215,0,.4);
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-bottom:18px;
  }
  .balance-box .label { font-size:13px; color:#ffd700; letter-spacing:1px; }
  .balance-box .amount { font-size:32px; font-weight:bold; margin:6px 0; }

  .list-item {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    font-size:13px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:6px;
  }
  .list-item .status { font-weight:bold; }
  .status.done { color:#4ade80; }
  .status.pending { color:#ffd700; }

  .info-box {
    background:rgba(255,255,255,0.06);
    border:1px dashed rgba(255,215,0,.5);
    border-radius:12px;
    padding:14px;
    font-size:13px;
    line-height:1.6;
    margin-bottom:14px;
    color:#e8e8f5;
    overflow-wrap:break-word;
    word-break:break-all;
  }
  .info-box b { color:#ffd700; }

  .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .header-row .back { cursor:pointer; font-size:20px; color:#ffd700; }
  .header-row .user { font-size:13px; color:#c9c9e0; text-align:right; }

  .hidden { display:none !important; }
  .row { display:flex; gap:10px; }
  .row .btn { flex:1; }
  .msg { text-align:center; font-size:13px; margin-top:10px; display:none; }
  .msg.show { display:block; }
  .msg.err { color:#ff6b6b; }
  .msg.ok { color:#4ade80; }

  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:8px 6px; text-align:left; border-bottom:1px solid rgba(255,255,255,0.12); }
  th { color:#ffd700; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ============ DATA LAYER ============
const DB = {
  users: JSON.parse(localStorage.getItem('inv_users') || '{}'),
  session: localStorage.getItem('inv_session') || null,
  save() {
    localStorage.setItem('inv_users', JSON.stringify(this.users));
    localStorage.setItem('inv_session', this.session);
  }
};

function currentUser() { return DB.session ? DB.users[DB.session] : null; }

function fmt(n) {
  return Number(n).toLocaleString('id-ID', {minimumFractionDigits:2, maximumFractionDigits:4});
}

// Terapkan keuntungan harian 0.9% untuk semua saldo (masa aktif 30 hari, tanpa compound)
function applyDailyProfit() {
  const today = new Date().toDateString();
  for (const uname in DB.users) {
    const u = DB.users[uname];
    if (!u.deposits) u.deposits = [];
    if (u.lastProfitDate === today) continue;
    u.deposits.forEach(d => {
      // hanya proses deposit aktif (belum melewati 30 hari sejak dibuat)
      const ageDays = (Date.now() - d.date) / (1000*60*60*24);
      if (ageDays < 30 && d.status === 'approved') {
        const profit = d.amount * 0.009; // 0.9%
        d.accrued = (d.accrued || 0) + profit;
        u.profitBalance = (u.profitBalance || 0) + profit;
      }
    });
    u.lastProfitDate = today;
  }
  DB.save();
}

// ============ RENDER ============
const app = document.getElementById('app');

function show(el) { app.innerHTML = ''; app.appendChild(el); }

function msg(msg, type='ok') {
  const m = document.createElement('div');
  m.className = 'msg show ' + (type==='ok' ? 'ok' : 'err');
  m.textContent = msg;
  return m;
}

// ---------- AUTH ----------
function renderAuth() {
  applyDailyProfit();
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <h1>💎 INVESTASI PREMIUM</h1>
    <div class="subtitle">Keuntungan 0.9% per hari · Masa Aktif 30 Hari</div>
    <div class="menu-grid">
      <div class="menu-card" id="btnReg"><div class="icon">📝</div><div class="txt">Register</div><div class="small">Buat akun baru</div></div>
      <div class="menu-card" id="btnLogin"><div class="icon">🔐</div><div class="txt">Login</div><div class="small">Masuk akun</div></div>
    </div>
  `;
  show(wrap);
  wrap.querySelector('#btnReg').onclick = () => renderRegister();
  wrap.querySelector('#btnLogin').onclick = () => renderLogin();
}

function renderRegister() {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">📝 Register</h2></div>
    <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Masukkan username"></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Masukkan password"></div>
    <div class="form-group"><label>Kode Referral (opsional)</label><input type="text" id="ref" placeholder="Kode referral teman"></div>
    <button class="btn" id="doReg">Daftar Sekarang</button>
    <div class="link"><a id="toLogin">Sudah punya akun? Login</a></div>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = renderAuth;
  wrap.querySelector('#toLogin').onclick = renderLogin;
  wrap.querySelector('#doReg').onclick = () => {
    const username = wrap.querySelector('#username').value.trim();
    const password = wrap.querySelector('#password').value.trim();
    const ref = wrap.querySelector('#ref').value.trim();
    if (!username || !password) return alert('Username dan password wajib diisi!');
    if (DB.users[username]) return alert('Username sudah terdaftar!');
    DB.users[username] = {
      password,
      balance: 0,
      profitBalance: 0,
      deposits: [],
      withdrawals: [],
      refCode: username,
      referredBy: ref && DB.users[ref] ? ref : null,
      lastProfitDate: null,
    };
    if (ref && DB.users[ref]) {
      DB.users[ref].referredBy = DB.users[ref].referredBy || ref;
    }
    DB.save();
    alert('Akun berhasil dibuat! Silakan login.');
    renderLogin();
  };
}

function renderLogin() {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">🔐 Login</h2></div>
    <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Username"></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Password"></div>
    <button class="btn" id="doLogin">Masuk</button>
    <div class="link"><a id="toReg">Belum punya akun? Register</a></div>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = renderAuth;
  wrap.querySelector('#toReg').onclick = renderRegister;
  wrap.querySelector('#doLogin').onclick = () => {
    const username = wrap.querySelector('#username').value.trim();
    const password = wrap.querySelector('#password').value.trim();
    const u = DB.users[username];
    if (!u || u.password !== password) return alert('Username atau password salah!');
    DB.session = username;
    DB.save();
    renderDashboard();
  };
}

// ---------- DASHBOARD ----------
function renderDashboard() {
  applyDailyProfit();
  const u = currentUser();
  if (!u) return renderAuth();
  const total = u.balance + u.profitBalance;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row">
      <span class="back" id="logout" title="Logout">🚪</span>
      <h2 style="flex:1;text-align:center;">💰 Dashboard</h2>
      <span class="user">👤 ${u.refCode}<br>ID: ${u.refCode}</span>
    </div>
    <div class="balance-box">
      <div class="label">TOTAL SALDO</div>
      <div class="amount">Rp ${fmt(total)}</div>
      <div style="font-size:12px;color:#c9c9e0;">Modal: Rp ${fmt(u.balance)} · Profit: Rp ${fmt(u.profitBalance)}</div>
    </div>
    <div class="menu-grid">
      <div class="menu-card" id="m-deposit"><div class="icon">💵</div><div class="txt">3. Deposit</div></div>
      <div class="menu-card" id="m-riwayatdep"><div class="icon">📜</div><div class="txt">4. Riwayat Deposit</div></div>
      <div class="menu-card" id="m-alamatdep"><div class="icon">🏦</div><div class="txt">5. Alamat Deposit</div></div>
      <div class="menu-card" id="m-withdraw"><div class="icon">🏧</div><div class="txt">6. Penarikan</div></div>
      <div class="menu-card" id="m-riwayatwd"><div class="icon">📋</div><div class="txt">7. Riwayat Penarikan</div></div>
      <div class="menu-card" id="m-alamatwd"><div class="icon">📮</div><div class="txt">8. Alamat Penarikan</div></div>
      <div class="menu-card" id="m-profit"><div class="icon">📈</div><div class="txt">9. Profit 0.9%/hari</div></div>
      <div class="menu-card" id="m-komisi"><div class="icon">🤝</div><div class="txt">10. Komisi 15%</div></div>
    </div>
  `;
  show(wrap);
  wrap.querySelector('#logout').onclick = () => { DB.session = null; DB.save(); renderAuth(); };
  wrap.querySelector('#m-deposit').onclick = renderDeposit;
  wrap.querySelector('#m-riwayatdep').onclick = renderRiwayatDeposit;
  wrap.querySelector('#m-alamatdep').onclick = renderAlamatDeposit;
  wrap.querySelector('#m-withdraw').onclick = renderWithdraw;
  wrap.querySelector('#m-riwayatwd').onclick = renderRiwayatWithdraw;
  wrap.querySelector('#m-alamatwd').onclick = renderAlamatWithdraw;
  wrap.querySelector('#m-profit').onclick = renderProfit;
  wrap.querySelector('#m-komisi').onclick = renderKomisi;
}

function backToDash() { renderDashboard(); }

// ---------- 3. DEPOSIT ----------
function renderDeposit() {
  const u = currentUser();
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">💵 Deposit</h2></div>
    <div class="form-group"><label>Jumlah Deposit (Rp)</label><input type="number" id="amount" min="10000" placeholder="Minimal Rp 10.000"></div>
    <button class="btn" id="doDep">Setor Sekarang</button>
    <div class="info-box" style="margin-top:14px;">
      💡 Keuntungan <b>0.9% per hari</b> selama <b>30 hari</b>.<br>
      Contoh: Deposit Rp 1.000.000 → profit Rp 9.000/hari.
    </div>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
  wrap.querySelector('#doDep').onclick = () => {
    const amount = parseFloat(wrap.querySelector('#amount').value);
    if (!amount || amount < 10000) return alert('Jumlah minimal Rp 10.000!');
    u.deposits.push({
      date: Date.now(),
      amount,
      status: 'approved',
      accrued: 0,
    });
    u.balance += amount;
    // komisi referral 15% untuk pengundang
    if (u.referredBy && DB.users[u.referredBy]) {
      const ref = DB.users[u.referredBy];
      const komisi = amount * 0.15;
      ref.profitBalance = (ref.profitBalance || 0) + komisi;
      if (!ref.comissionHistory) ref.comissionHistory = [];
      ref.comissionHistory.push({ date: Date.now(), from: u.refCode, amount, komisi });
    }
    DB.save();
    alert('Deposit berhasil! Saldo ditambahkan.');
    renderDashboard();
  };
}

// ---------- 4. RIWAYAT DEPOSIT ----------
function renderRiwayatDeposit() {
  const u = currentUser();
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">📜 Riwayat Deposit</h2></div>`;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
  if (!u.deposits.length) {
    wrap.innerHTML += '<div class="list-item" style="justify-content:center;">Belum ada riwayat deposit.</div>';
    return;
  }
  u.deposits.slice().reverse().forEach(d => {
    const div = document.createElement('div');
    div.className = 'list-item';
    const tgl = new Date(d.date).toLocaleString('id-ID');
    div.innerHTML = `
      <span>${tgl}</span>
      <span>Rp ${fmt(d.amount)}</span>
      <span class="status done">✓ ${d.status}</span>
    `;
    wrap.appendChild(div);
  });
}

// ---------- 5. ALAMAT DEPOSIT ----------
function renderAlamatDeposit() {
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">🏦 Alamat Deposit</h2></div>
    <div class="info-box">
      <b>BTC:</b> bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh<br><br>
      <b>USDT (TRC20):</b> TX9kLuBmcVkV7nXwEH2nGuQfGkGqK5nV1P<br><br>
      <b>Bank BCA:</b> 8123456789 a.n. Investasi Premium
    </div>
    <div class="list-item" style="justify-content:center;color:#ffd700;">Silakan transfer sesuai alamat di atas, lalu input deposit.</div>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
}

// ---------- 6. PENARIKAN ----------
function renderWithdraw() {
  const u = currentUser();
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">🏧 Penarikan</h2></div>
    <div style="text-align:center;margin-bottom:12px;font-size:13px;color:#c9c9e0;">Saldo tersedia: <b style="color:#ffd700;">Rp ${fmt(u.balance + u.profitBalance)}</b></div>
    <div class="form-group"><label>Jumlah Penarikan (Rp)</label><input type="number" id="amount" min="10000" placeholder="Minimal Rp 10.000"></div>
    <div class="form-group"><label>Metode</label>
      <select id="method">
        <option value="Bank Transfer">Bank Transfer</option>
        <option value="USDT (TRC20)">USDT (TRC20)</option>
        <option value="BTC">BTC</option>
      </select>
    </div>
    <div class="form-group"><label>Alamat / Rekening Tujuan</label><input type="text" id="addr" placeholder="Nomor rekening / alamat wallet"></div>
    <button class="btn" id="doWd">Ajukan Penarikan</button>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
  wrap.querySelector('#doWd').onclick = () => {
    const amount = parseFloat(wrap.querySelector('#amount').value);
    const method = wrap.querySelector('#method').value;
    const addr = wrap.querySelector('#addr').value.trim();
    const total = u.balance + u.profitBalance;
    if (!amount || amount < 10000) return alert('Jumlah minimal Rp 10.000!');
    if (amount > total) return alert('Saldo tidak mencukupi!');
    if (!addr) return alert('Alamat tujuan wajib diisi!');
    // kurangi dari profit dulu, lalu modal
    let sisa = amount;
    if (u.profitBalance >= sisa) { u.profitBalance -= sisa; sisa = 0; }
    else { sisa -= u.profitBalance; u.profitBalance = 0; u.balance -= sisa; }
    u.withdrawals.push({ date: Date.now(), amount, method, addr, status: 'pending' });
    DB.save();
    alert('Pengajuan penarikan berhasil! (status: pending)');
    renderDashboard();
  };
}

// ---------- 7. RIWAYAT PENARIKAN ----------
function renderRiwayatWithdraw() {
  const u = currentUser();
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">📋 Riwayat Penarikan</h2></div>`;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
  if (!u.withdrawals.length) {
    wrap.innerHTML += '<div class="list-item" style="justify-content:center;">Belum ada riwayat penarikan.</div>';
    return;
  }
  u.withdrawals.slice().reverse().forEach(w => {
    const div = document.createElement('div');
    div.className = 'list-item';
    const tgl = new Date(w.date).toLocaleString('id-ID');
    div.innerHTML = `
      <span>${tgl}</span>
      <span>Rp ${fmt(w.amount)} · ${w.method}</span>
      <span class="status ${w.status === 'approved' ? 'done' : 'pending'}">${w.status === 'approved' ? '✓ Selesai' : '⏳ Pending'}</span>
    `;
    wrap.appendChild(div);
  });
}

// ---------- 8. ALAMAT PENARIKAN ----------
function renderAlamatWithdraw() {if (amount < 50000) { alert('Minimal Rp 35.000 bos!'); return; }
  const u = currentUser();
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">📮 Alamat Penarikan</h2></div>
    <div class="info-box">
      Atur alamat penarikan Anda. Masukkan alamat wallet/rekening yang akan digunakan saat penarikan dana.
    </div>
    <div class="form-group"><label>Simpan Alamat Penarikan</label><input type="text" id="addr" placeholder="Rekening / wallet address" value="${u.withdrawAddr || ''}"></div>
    <button class="btn" id="saveAddr">Simpan Alamat</button>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
  wrap.querySelector('#saveAddr').onclick = () => {
    u.withdrawAddr = wrap.querySelector('#addr').value.trim();
    DB.save();
    alert('Alamat penarikan tersimpan!');
  };
}

// ---------- 9. PROFIT HARIAN ----------
function renderProfit() {
  const u = currentUser();
  applyDailyProfit();
  const wrap = document.createElement('div');
  let rows = '';
  u.deposits.slice().reverse().forEach(d => {
    const daysActive = Math.min(30, Math.floor((Date.now() - d.date)/(1000*60*60*24)));
    rows += `<tr><td>Rp ${fmt(d.amount)}</td><td>Rp ${fmt(d.accrued)}</td><td>${daysActive}/30 hari</td></tr>`;
  });
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">📈 Profit Harian 0.9%</h2></div>
    <div class="balance-box">
      <div class="label">TOTAL PROFIT TERKUMPUL</div>
      <div class="amount">Rp ${fmt(u.profitBalance)}</div>
    </div>
    <label style="margin-bottom:8px;">Detail profit per deposit:</label>
    <div class="table-wrap">
      <table>
        <tr><th>Modal</th><th>Profit 0.9%</th><th>Aktif</th></tr>
        ${rows || '<tr><td colspan="3" style="text-align:center;">Belum ada deposit</td></tr>'}
      </table>
    </div>
    <div class="info-box" style="margin-top:14px;">
      💎 Keuntungan <b>0.9% per hari</b> diberikan otomatis setiap hari.<br>
      Masa aktif setiap deposit <b>30 hari</b>.
    </div>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
}

// ---------- 10. KOMISI REFERRAL ----------
function renderKomisi() {
  const u = currentUser();
  const wrap = document.createElement('div');
  const totalKomisi = (u.comissionHistory || []).reduce((s, c) => s + c.komisi, 0);
  let hist = '';
  (u.comissionHistory || []).slice().reverse().forEach(c => {
    const tgl = new Date(c.date).toLocaleString('id-ID');
    hist += `<tr><td>${tgl}</td><td>${c.from}</td><td>Rp ${fmt(c.amount)}</td><td>Rp ${fmt(c.komisi)}</td></tr>`;
  });
  wrap.innerHTML = `
    <div class="header-row"><span class="back" id="back">←</span><h2 style="flex:1;text-align:center;">🤝 Komisi 15%</h2></div>
    <div class="balance-box">
      <div class="label">TOTAL KOMISI</div>
      <div class="amount">Rp ${fmt(totalKomisi)}</div>
    </div>
    <div class="info-box">
      📢 <b>Kode Referral Anda:</b> <span style="color:#ffd700;font-size:16px;">${u.refCode}</span><br>
      Bagikan ke teman. Setiap deposit teman, Anda dapat <b>komisi 15%</b>.
    </div>
    <label style="margin-bottom:8px;">Riwayat komisi:</label>
    <div class="table-wrap">
      <table>
        <tr><th>Tanggal</th><th>Dari</th><th>Deposit</th><th>Komisi 15%</th></tr>
        ${hist || '<tr><td colspan="4" style="text-align:center;">Belum ada komisi</td></tr>'}
      </table>
    </div>
  `;
  show(wrap);
  wrap.querySelector('#back').onclick = backToDash;
}

// ============ INIT ============
if (DB.session && DB.users[DB.session]) {
  renderDashboard();
} else {
  renderAuth();
}
</script>
</body>
</html>
