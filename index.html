<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chainvest - Invest Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f172a;color:white;min-height:100vh}
.header{background:#1e293b;padding:16px;text-align:center;position:sticky;top:0}
.header h1{color:#38bdf8;font-size:22px}
.saldo{background:linear-gradient(135deg,#0ea5e9,#6366f1);margin:16px;border-radius:16px;padding:20px}
.saldo p{opacity:0.8;font-size:14px}
.saldo h2{font-size:28px;margin:8px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:#1e293b;padding:16px;border-radius:12px;text-align:center}
.card h3{color:#38bdf8;margin-bottom:8px}
.btn{background:#0ea5e9;color:white;border:none;padding:10px 20px;border-radius:8px;width:100%;margin-top:8px;font-weight:bold}
.porto{padding:16px}
.item{background:#1e293b;margin-top:10px;padding:12px;border-radius:10px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="header"><h1>CHAINVEST INVEST</h1></div>
<div class="saldo">
<p>Total Aset Investasi</p>
<h2>Rp 12.500.000</h2>
<p>+12.5% bulan ini 🚀</p>
</div>
<div class="menu">
<div class="card"><h3>Bitcoin</h3><p>BTC</p><button class="btn">Invest</button></div>
<div class="card"><h3>Ethereum</h3><p>ETH</p><button class="btn">Invest</button></div>
<div class="card"><h3>Gold</h3><p>XAU</p><button class="btn">Invest</button></div>
<div class="card"><h3>Saham</h3><p>US Stock</p><button class="btn">Invest</button></div>
</div>
<div class="porto">
<h3>Portofolio Saya</h3>
<div class="item"><span>BTC - 0.05</span><span style="color:#22c55e">+5.2%</span></div>
<div class="item"><span>ETH - 1.2</span><span style="color:#22c55e">+8.1%</span></div>
<div class="item"><span>Gold - 10gr</span><span style="color:#ef4444">-1.2%</span></div>
</div>
</body>
</html>
