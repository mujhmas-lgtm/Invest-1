<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoVest - Investasi Crypto</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --bg-sidebar: #0d0d18;
            --gold: #f0b90b;
            --gold-light: #fcd535;
            --green: #0ecb81;
            --red: #f6465d;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --text-muted: #5e6673;
            --border: #2b2b3a;
            --blue-accent: #3b82f6;
            --purple-accent: #8b5cf6;
            --gradient-1: linear-gradient(135deg, #f0b90b, #f7931a);
            --gradient-2: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --gradient-3: linear-gradient(135deg, #0ecb81, #3b82f6);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b2b3a;
            border-radius: 10px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: transform var(--transition);
        }

        .sidebar-logo {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--gradient-1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #000;
        }

        .sidebar-logo .logo-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .sidebar-logo .logo-text span {
            color: var(--gold);
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .nav-section {
            margin-bottom: 8px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            padding: 12px 10px 6px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            margin-bottom: 2px;
            font-weight: 500;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: rgba(240, 185, 11, 0.12);
            color: var(--gold);
            font-weight: 600;
        }
        .nav-item .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-item.logout-btn {
            color: var(--red);
            margin-top: 8px;
            border-top: 1px solid var(--border);
            border-radius: 0;
            padding-top: 16px;
            margin-top: 12px;
        }
        .nav-item.logout-btn:hover {
            background: rgba(246, 70, 93, 0.08);
        }

        .sidebar-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            padding: 0;
            overflow-y: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .topbar-title {
            font-size: 20px;
            font-weight: 700;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: 500;
        }
        .user-badge .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--gradient-2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
        }

        .content-area {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 28px;
        }
        .page-header h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }
        .stat-card.gold::before {
            background: var(--gradient-1);
        }
        .stat-card.blue::before {
            background: var(--gradient-2);
        }
        .stat-card.green::before {
            background: var(--gradient-3);
        }
        .stat-card .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-card .stat-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .stat-card .stat-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            opacity: 0.08;
        }

        /* ===== FORMS ===== */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 560px;
        }
        .form-card h3 {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: border var(--transition);
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-group .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            font-family: inherit;
        }
        .btn-gold {
            background: var(--gradient-1);
            color: #000;
        }
        .btn-gold:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(240, 185, 11, 0.3);
        }
        .btn-blue {
            background: var(--gradient-2);
            color: #fff;
        }
        .btn-blue:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-block {
            width: 100%;
        }

        /* ===== TABLES ===== */
        .table-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(43, 43, 58, 0.5);
            color: var(--text-secondary);
        }
        table tr:last-child td {
            border-bottom: none;
        }
        table tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success {
            background: rgba(14, 203, 129, 0.15);
            color: var(--green);
        }
        .badge-warning {
            background: rgba(240, 185, 11, 0.15);
            color: var(--gold);
        }
        .badge-danger {
            background: rgba(246, 70, 93, 0.15);
            color: var(--red);
        }
        .badge-info {
            background: rgba(59, 130, 246, 0.15);
            color: var(--blue-accent);
        }
        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .text-green {
            color: var(--green);
        }
        .text-red {
            color: var(--red);
        }
        .text-gold {
            color: var(--gold);
        }
        .text-muted {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* ===== ALERTS & TOASTS ===== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px  20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 14px;
            z-index: 9999;
            animation: slideInRight 0.3s ease;
            box-shadow: var(--shadow);
            max-width: 380px;
        }
        .toast.success {
            background: #0c3d2a;
            color: #0ecb81;
            border: 1px solid #0ecb8133;
        }
        .toast.error {
            background: #3d0c1a;
            color: #f6465d;
            border: 1px solid #f6465d33;
        }
        .toast.info {
            background: #0c2840;
            color: #3b82f6;
            border: 1px solid #3b82f633;
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-state p {
            font-size: 14px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 440px;
            width: 90%;
        }
        .modal h3 {
            margin-bottom: 12px;
        }
        .modal p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ===== REFERRAL LINK BOX ===== */
        .referral-box {
            background: var(--bg-primary);
            border: 1px dashed var(--gold);
            border-radius: var(--radius-sm);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }
        .referral-box input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            font-family: monospace;
        }

        /* ===== AUTH PAGES ===== */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            width: 100%;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow);
        }
        .auth-card h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 6px;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }
        .auth-card .form-group:last-of-type {
            margin-bottom: 20px;
        }

        /* ===== RESPONISVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                transition: left 0.3s ease;
            }
            .sidebar.open {
                left: 0;
            }
            .menu-toggle {
                display: block;
            }
            .content-area {
                padding: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .topbar {
                padding: 12px 16px;
            }
            .form-card {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .auth-card {
                padding: 24px 20px;
            }
            table {
                font-size: 11px;
            }
            table th, table td {
                padding: 8px;
            }
            .user-badge span:first-of-type {
                display: none;
            }
        }

        /* ===== OVERLAY FOR MOBILE ===== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 99;
        }
        .sidebar-overlay.show {
            display: block;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebarlogo">
            <div class="logo-icon">₿</div>
            <div class="logo-text">Crypto<span>Vest</span></div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <!-- Filled by JS -->
        </nav>
        <div class="sidebar-footer">© 2025 CryptoVest</div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <span class="topbar-title" id="pageTitle">Dashboard</span>
            </div>
            <div class="topbar-right" id="topbarRight">
                <!-- Filled by JS -->
            </div>
        </header>
        <div class="content-area" id="contentArea">
            <!-- Dynamic content -->
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer"></div>

    <script>
        // ==================== DATABASE ====================
        const DB_KEYS = {
            USERS: 'cryptovest_users',
            CURRENT_USER: 'cryptovest_currentUser',
            DEPOSITS: 'cryptovest_deposits',
            WITHDRAWALS: 'cryptovest_withdrawals',
            PROFIT_LOG: 'cryptovest_profitLog',
        };

        function getDB(key) {
            try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
        }
        function setDB(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }
        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem(DB_KEYS.CURRENT_USER)); } catch (e) { return null; }
        }
        function setCurrentUser(user) {
            localStorage.setItem(DB_KEYS.CURRENT_USER, JSON.stringify(user));
        }
        function clearCurrentUser() {
            localStorage.removeItem(DB_KEYS.CURRENT_USER);
        }

        // Sync user data from Users array
        function refreshCurrentUser() {
            const cu = getCurrentUser();
            if (!cu) return null;
            const users = getDB(DB_KEYS.USERS);
            const idx = users.findIndex(u => u.id === cu.id);
            if (idx === -1) { clearCurrentUser(); return null; }
            setCurrentUser(users[idx]);
            return users[idx];
        }

        function updateUserInDB(user) {
            const users = getDB(DB_KEYS.USERS);
            const idx = users.findIndex(u => u.id === user.id);
            if (idx !== -1) users[idx] = user;
            else users.push(user);
            setDB(DB_KEYS.USERS, users);
            setCurrentUser(user);
        }

        // ==================== TOAST ====================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ==================== HELPER FUNCTIONS ====================
        function generateId() {
            return 'crypto_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        function formatCurrency(amount) {
            return '$' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/, ',');
        }
        function formatDatetime(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        function timeAgo(dateStr) {
            if (!dateStr) return '-';
            const now = new Date();
            const then = new Date(dateStr);
            const diffMs = now - then;
            const mins = Math.floor(diffMs / 60000);
            const hrs = Math.floor(diffMs / 3600000);
            const days = Math.floor(diffMs / 86400000);
            if (mins < 1) return 'Baru saja';
            if (mins < 60) return mins + ' menit lalu';
            if (hrs < 24) return hrs + ' jam lalu';
            return days + ' hari lalu';
        }
        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('Berhasil disalin!', 'success'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Berhasil disalin!', 'success');
            }
        }

        // ==================== AUTH: REGISTER ====================
        function registerUser(username, email, password, referralCode) {
            const users = getDB(DB_KEYS.USERS);
            if (users.find(u => u.email === email)) {
                showToast('Email sudah terdaftar!', 'error');
                return false;
            }
            if (users.find(u => u.username === username)) {
                showToast('Username sudah digunakan!', 'error');
                return false;
            }

            const newUser = {
                id: generateId(),
                username,
                email,
                password,
                balance: 0,
                profitBalance: 0,
                totalDeposit: 0,
                totalWithdraw: 0,
                referralCode: 'REF' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                referredBy: referralCode || null,
                referralEarnings: 0,
                registeredAt: new Date().toISOString(),
                lastProfitUpdate: new Date().toISOString(),
            };

            // Handle referral
            if (referralCode) {
                const referrer = users.find(u => u.referralCode === referralCode);
                if (referrer) {
                    newUser.referredBy = referralCode;
                    // Initial small bonus
                    newUser.balance += 5;
                    showToast('Bonus $5 dari referral!', 'success');
                } else {
                    showToast('Kode referral tidak ditemukan, tetap mendaftar tanpa referral.', 'info');
                    newUser.referredBy = null;
                }
            }

            users.push(newUser);
            setDB(DB_KEYS.USERS, users);
            setCurrentUser(newUser);

        function submitDeposit(user, amount, method, txHash) {
            const deposit = {
                id: generateId(),
                userId: user.id,
                amount: parseFloat(amount),
                method,
                txHash: txHash || '',
                status: 'pending',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            };
            const deposits = getDB(DB_KEYS.DEPOSITS);
            deposits.unshift(deposit);
            setDB(DB_KEYS.DEPOSIT S, deposits);
            showToast('Deposit berhasil dikirim! Menunggu konfirmasi.', 'success');
            return deposit;
        }

        function approveDeposit(depositId) {
            const deposits = getDB(DB_KEYS.DEPOSITS);
            const dep = deposits.find(d => d.id === depositId);
            if (!dep || dep.status !== 'pending') return;
            dep.status = 'approved';
            dep.updatedAt = new Date().toISOString();
            setDB(DB_KEYS.DEPOSITS, deposits);

            const users = getDB(DB_KEYS.USERS);
            const user = users.find(u => u.id === dep.userId);
            if (user) {
                user.balance += dep.amount;
                user.totalDeposit += dep.amount;
                updateUserInDB(user);

                // Referral commission for the referrer
                if (user.referredBy) {
                    const referrer = users.find(u => u.referralCode === user.referredBy);
                    if (referrer && referrer.id !== user.id) {
                        const commission = dep.amount * 0.15;
                        referrer.referralEarnings += commission;
                        referrer.balance += commission;
                        const refIdx = users.findIndex(u => u.id === referrer.id);
                        if (refIdx !== -1) users[refIdx] = referrer;
                        setDB(DB_KEYS.USERS, users);
                    }
                }
            }
        }

        function submitWithdrawal(user, amount, method, address) {
            const withdrawal = {
                id: generateId(),
                userId: user.id,
                amount: parseFloat(amount),
                method,
                address,
                status: 'pending',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            };
            const withdrawals = getDB(DB_KEYS.WITHDRAWALS);
            withdrawals.unshift(withdrawal);
            setDB(DB_KEYS.WITHDRAWALS, withdrawals);

            // Deduct from balance
            user.balance -= parseFloat(amount);
            updateUserInDB(user);
            showToast('Penarikan berhasil diajukan! Menunggu proses.', 'success');
            return withdrawal;
        }

            const withdrawals = getDB(DB_KEYS.WITHDRAWALS);
            const wd = withdrawals.find(w => w.id === withdrawalId);
            if (!wd || wd.status !== 'pending') return;
            wd.status = 'approved';

            setDB(DB_KEYS.WITHDRAWALS, withdrawals);

            const users = getDB(DB_KEYS.USERS);
            const user = users.find(u => u.id === wd.userId);
            if (user) {

                setDB(DB_KEYS.USERS, users);
                setCurrentUser(user);
            }
        }

        // ==================== DAILY PROFIT ====================
        function calculateDailyProfit(user) {
            if (!user || user.totalDeposit <= 0) return 0;

            const now = new Date();
            const lastUpdate = new Date(user.lastProfitUpdate || user.registeredAt);
            const diffTime = now - lastUpdate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays <= 0) return 0;

            const dailyRate = 0.009; // 0.9%
            let totalProfit = 0;

            for (let i = 0; i < diffDays; i++) {
                totalProfit += user.totalDeposit * dailyRate;
            }

            return totalProfit;
        }

        function updateProfitBalances() {
            const users = getDB(DB_KEYS.USERS);
            let changed = false;

            users.forEach(user => {
                const profit = calculateDailyProfit(user);
                if (profit > 0) {
                    user.profitBalance += profit;
                    user.lastProfitUpdate = new Date().toISOString();
                    changed = true;
                }
            });

            if (changed) setDB(DB_KEYS.USERS, users);

            // Refresh current user
            const cu = getCurrentUser();
            if (cu) {
                const fresh = users.find(u => u.id === cu.id);
                if (fresh) setCurrentUser(fresh);
            }
        }

        function handleWithdrawal(e) {
            e.preventDefault();
            const user = getCurrentUser();
            if (!user) return;
            const amount = parseFloat(document.getElementById('withdrawalAmount').value);
            const method = document.getElementById('withdrawalMethod').value;
            const address = document.getElementById('withdrawalAddress').value.trim();

            if (amount < 10) {
                showToast('Minimal penarikan $10!', 'error');
                return;
            }
            if (amount > user.balance) {
                showToast('Saldo tidak mencukupi!', 'error');
                return;
            }

            submitWithdrawal(user, amount, method, address);
            document.getElementById('withdrawalForm').reset();
            // Simulate auto-approval
            setTimeout(() => {
                const withdrawals = getDB(DB_KEYS.WITHDRAWALS);
                const pending = withdrawals.find(w => w.userId === user.id && w.status === 'pending');
                if (pending) {
                    approveWithdrawal(pending.id);
                    showToast('✅ Penarikan telah diproses!', 'success');
                    navigateTo('withdrawal-history');
                }
            }, 4000);
            setTimeout(() => navigateTo('withdrawal-history'), 1000);
        }

        function getSavedAddresses(user) {
            const key = 'saved_addresses_' + user.id;
            try { return JSON.parse(localStorage.getItem(key)) || '[]'); } catch(e) { return []; }
        }

        function saveAddress(user, addressData) {
            const key = 'saved_addresses_' + user.id;
            const addresses = getSavedAddresses(user);
            addresses.push({ ...addressData, id: generateId(), createdAt: new Date().toISOString() });
            localStorage.setItem(key, JSON.stringify(addresses));
        }

        function deleteAddress(user, addressId) {
            const key = 'saved_addresses_' + user.id;
            let addresses = getSavedAddresses(user);
            addresses = addresses.filter(a => a.id !== addressId);
            localStorage.setItem(key, JSON.stringify(addresses));
        }

            const addresses = getSavedAddresses(user);

                        <button class="btn btn-sm btn-outline" onclick="deleteAddressAndRefresh('${a.id}')" style="color:var(--red);">🗑</button>

            `).join('');
